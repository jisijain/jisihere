<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<header style="position:sticky;top:0;z-index:80;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:20px;padding:16px clamp(20px,5vw,64px);background:rgba(122,20,32,.85);backdrop-filter:blur(14px);font-family:'Archivo',system-ui,sans-serif;">
  <a href="Home.dc.html" style="justify-self:start;font-family:'Anton',sans-serif;font-weight:400;font-size:1.6rem;letter-spacing:.04em;color:#f4ebe6;display:inline-flex;align-items:center;gap:.4em;">jisijain<span style="width:10px;height:10px;border-radius:50%;background:#b32434;display:inline-block;"></span></a>
  <nav aria-label="Primary" class="nav-links {{menuOpenClass}}" style="justify-self:center;display:flex;align-items:center;gap:4px;background:rgba(28,10,13,.4);border:1px solid rgba(244,235,230,.28);padding:6px;border-radius:999px;flex-wrap:wrap;">
    <sc-if value="{{isHome}}" hint-placeholder-val="{{false}}"><span style="font-size:.8rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:.65em 1.1em;border-radius:999px;background:#f4ebe6;color:#1c0a0d;">Home</span></sc-if>
    <sc-if value="{{notHome}}" hint-placeholder-val="{{true}}"><a href="Home.dc.html" style="font-size:.8rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:.65em 1.1em;border-radius:999px;color:#f4ebe6;" style-hover="background:rgba(244,235,230,.1);">Home</a></sc-if>
    <sc-if value="{{isWork}}" hint-placeholder-val="{{false}}"><span style="font-size:.8rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:.65em 1.1em;border-radius:999px;background:#f4ebe6;color:#1c0a0d;">Work</span></sc-if>
    <sc-if value="{{notWork}}" hint-placeholder-val="{{true}}"><a href="Work.dc.html" style="font-size:.8rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:.65em 1.1em;border-radius:999px;color:#f4ebe6;" style-hover="background:rgba(244,235,230,.1);">Work</a></sc-if>
    <sc-if value="{{isServices}}" hint-placeholder-val="{{false}}"><span style="font-size:.8rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:.65em 1.1em;border-radius:999px;background:#f4ebe6;color:#1c0a0d;">Skills &amp; Services</span></sc-if>
    <sc-if value="{{notServices}}" hint-placeholder-val="{{true}}"><a href="Services.dc.html" style="font-size:.8rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:.65em 1.1em;border-radius:999px;color:#f4ebe6;" style-hover="background:rgba(244,235,230,.1);">Skills &amp; Services</a></sc-if>
    <sc-if value="{{isAbout}}" hint-placeholder-val="{{false}}"><span style="font-size:.8rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:.65em 1.1em;border-radius:999px;background:#f4ebe6;color:#1c0a0d;">About</span></sc-if>
    <sc-if value="{{notAbout}}" hint-placeholder-val="{{true}}"><a href="About.dc.html" style="font-size:.8rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:.65em 1.1em;border-radius:999px;color:#f4ebe6;" style-hover="background:rgba(244,235,230,.1);">About</a></sc-if>
    <sc-if value="{{isContact}}" hint-placeholder-val="{{false}}"><span style="font-size:.8rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:.65em 1.1em;border-radius:999px;background:#f4ebe6;color:#1c0a0d;">Contact</span></sc-if>
    <sc-if value="{{notContact}}" hint-placeholder-val="{{true}}"><a href="Contact.dc.html" style="font-size:.8rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:.65em 1.1em;border-radius:999px;color:#f4ebe6;" style-hover="background:rgba(244,235,230,.1);">Contact</a></sc-if>
  </nav>
  <button type="button" class="nav-toggle" onclick="{{toggleMenu}}" aria-label="Toggle menu" style="justify-self:end;width:42px;height:42px;border-radius:50%;border:1px solid rgba(244,235,230,.28);background:rgba(28,10,13,.4);color:#f4ebe6;align-items:center;justify-content:center;">
    <sc-if value="{{menuOpen}}" hint-placeholder-val="{{false}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:20px;height:20px;"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg></sc-if>
    <sc-if value="{{menuClosed}}" hint-placeholder-val="{{true}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:20px;height:20px;"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></sc-if>
  </button>
</header>
<button type="button" ref="{{topBtnRef}}" onclick="{{scrollTop}}" class="back-to-top" aria-label="Back to top">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="width:20px;height:20px;"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
</button>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;active&quot;:{&quot;editor&quot;:null,&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { menuOpen: false };
  setTopBtnRef(el) {
    if (el && !el.__wired) {
      el.__wired = true;
      const onScroll = () => {
        if (window.scrollY > 480) el.classList.add('visible');
        else el.classList.remove('visible');
      };
      window.addEventListener('scroll', onScroll, { passive: true });
      onScroll();
    }
  }
  renderVals() {
    const a = this.props.active || 'home';
    const menuOpen = this.state.menuOpen;
    return {
      isHome: a === 'home', notHome: a !== 'home',
      isWork: a === 'work', notWork: a !== 'work',
      isServices: a === 'services', notServices: a !== 'services',
      isAbout: a === 'about', notAbout: a !== 'about',
      isContact: a === 'contact', notContact: a !== 'contact',
      menuOpen, menuClosed: !menuOpen,
      menuOpenClass: menuOpen ? 'open' : '',
      toggleMenu: () => this.setState((s) => ({ menuOpen: !s.menuOpen })),
      topBtnRef: (el) => this.setTopBtnRef(el),
      scrollTop: () => window.scrollTo({ top: 0, behavior: 'smooth' }),
    };
  }
}
</script>
</body>
</html>
